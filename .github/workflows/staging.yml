name: Deploy to Staging (ECS + SWR)

on:
  push:
    branches: [ "staging" ]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  SWR_REGISTRY: swr.ap-southeast-1.myhuaweicloud.com
  SWR_NAMESPACE: opencati
  SWR_REPO: opencati
  IMAGE_NAME: swr.ap-southeast-1.myhuaweicloud.com/opencati/opencati

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # === This replicates your docker login (using secrets instead of plaintext) ===
      - name: Log in to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}   
          password: ${{ secrets.SWR_PASSWORD }} 

      - name: Build & Push image (staging-latest + sha tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging-latest
            ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          provenance: false
          sbom: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into ECS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}        
          username: ${{ secrets.ECS_USER }}    
          key: ${{ secrets.ECS_SSH_KEY }}     
          port: 22
          script: |
            set -e
            echo "[1/5] docker login to SWR"
            docker login ${{ env.SWR_REGISTRY }} -u "${{ secrets.SWR_USERNAME }}" -p "${{ secrets.SWR_PASSWORD }}"
            echo "[2/5] cd /opt/opencati-staging"
            cd /opt/opencati-staging
            echo "[3/5] pull latest images"
            docker compose pull
            echo "[4/5] recreate containers"
            docker compose up -d
            echo "[5/5] prune old images"
            docker image prune -af || true
            echo "Recent app logs:"
            docker compose logs --tail 60 app-staging || true